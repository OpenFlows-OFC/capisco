<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Prumo · App de Estudos: uma missão curta nos dias que você escolhe, com pergunta antes de ler, questões do Enem e fim projetado. Seus dados ficam no seu aparelho.">
<title>Prumo · App de Estudos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="icon" href="icone-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prumo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap">
<link rel="stylesheet" href="css/prumo.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/nucleo/nucleo.js">
<link rel="modulepreload" href="conteudo/mat-fa.js">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app" class="app sem-faixa">
  <main class="pu" id="abrindo">
    <p class="rotulo">Prumo · App de Estudos</p>
    <p id="abrindo-texto">Abrindo o caderno…</p>
  </main>
  <noscript><main class="pu"><p>O Prumo precisa de JavaScript ligado no navegador.</p></main></noscript>
</div>
<script>
  // Se o app não abriu em 10 s (primeiro acesso sem internet, por exemplo), diz o que fazer (c.12).
  setTimeout(function () {
    if (document.documentElement.dataset.pronto) return;
    var t = document.getElementById('abrindo-texto');
    if (!t) return;
    t.textContent = 'O Prumo precisa de internet só na primeira vez, para guardar o app neste aparelho. Conecte-se e abra de novo.';
    var b = document.createElement('button');
    b.className = 'botao'; b.type = 'button'; b.textContent = 'Tentar de novo';
    b.onclick = function () { location.reload(); };
    t.parentNode.appendChild(b);
  }, 10000);
</script>
</body>
</html>
